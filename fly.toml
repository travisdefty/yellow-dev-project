app = 'yellow-travisdefty'
primary_region = 'jnb'

[build]

[env]
  PORT = '3000'
  # Form actions are POSTs, and SvelteKit rejects a POST whose Origin header does not match the
  # origin it thinks it is serving. Deriving that from forwarded headers works until a header is
  # dropped somewhere in front of the app, and the failure mode is every submit returning 403 with
  # nothing in the logs. There is exactly one hostname here, so it is stated outright.
  ORIGIN = 'https://app.yellow.travisdefty.co.za'
  NODE_ENV = 'production'
  PROTOCOL_HEADER = 'x-forwarded-proto'
  HOST_HEADER = 'x-forwarded-host'
  # SQLite on the mounted volume. Everything outside /data is part of the image and is replaced on
  # every deploy, so this is the one path where an application can survive one.
  DB_PATH = '/data/yellow.db'

# Create once, before the first deploy that needs it:
#   fly volumes create yellow_data --region jnb --size 1
#
# A volume cannot be shared between machines, so this app is deliberately a single machine. That is
# the trade-off SQLite asks for and it is a fair one here: one process, one file, no connection
# string, nothing to provision. Scaling past one machine means moving to Postgres.
[[mounts]]
  source = 'yellow_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
